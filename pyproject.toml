[project]
name = "romaji"
version = "0.1.0"
description = "ローマ字入力を LLM で日本語文に変換する Web アプリ"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=2.53.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.1",
]

[project.scripts]
romaji = "romaji.cli:main"
romaji-server = "romaji.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/romaji"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that call real external APIs",
]
